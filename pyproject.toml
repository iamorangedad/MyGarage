[project]
name = "mygarage"
version = "0.1.0"
description = "A car repair simulator using MuJoCo for physics simulation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "imgui>=2.0.0; extra == 'ui'",
]

[project.optional-dependencies]
ui = [
    "imgui>=2.0.0",
    "glfw>=2.6.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
mygarage = "mygarage.ui.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"
